<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="edit.css">

</head>
<body>
    <div id="addEvent" class="container mt-4">

    <h2>Add / Edit Event</h2>

    <input type="text" id="title" placeholder="Event Title" class="form-control mb-2">

    <input type="text" id="image" placeholder="Image URL" class="form-control mb-2">

    <input type="text" id="location" placeholder="Location" class="form-control mb-2">

    <input type="date" id="date" class="form-control mb-2">

    <input type="time" id="time" class="form-control mb-2">

    <input type="text" id="category" placeholder="Category" class="form-control mb-2">

    <input type="text" id="organizer" placeholder="Organizer" class="form-control mb-2">

    <input type="number" id="availableSeats" placeholder="Seats" class="form-control mb-2">

    <input type="number" id="price" placeholder="Price" class="form-control mb-2">

    <textarea id="description"
        placeholder="Description"
        class="form-control mb-3"></textarea>

    <button
        id="submitBtn"
        class="btn btn-primary"
        onclick="updateEvent()">
        Update Event
    </button>

</div>
<script type="module" src="./edit.js"></script>
</body>
</html>
