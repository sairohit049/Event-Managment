<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Successful</title>
    <style>*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.success-card{

    width:600px;
    background:white;
    border-radius:15px;
    box-shadow:0 15px 30px rgba(0,0,0,.15);
    padding:40px;
    text-align:center;

}

.success-icon{

    font-size:80px;
    color:green;

}

.success-card h1{

    margin-top:15px;
    color:#222;

}

.success-card p{

    color:#666;
    margin:10px 0;

}

.details{

    margin-top:30px;
    text-align:left;
    background:#f4f4f4;
    padding:20px;
    border-radius:10px;

}

.details p{

    margin:12px 0;
    font-size:18px;

}

.btns{

    margin-top:30px;

}

.btns button{

    padding:12px 25px;
    margin:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;

}

.home{

    background:#0d6efd;
    color:white;

}

.booking{

    background:green;
    color:white;

}

button:hover{

    opacity:.9;

}</style>
</head>
<body>

    <div id="successContainer"></div>

    <script type="module" src="success.js"></script>

</body>
</html>
