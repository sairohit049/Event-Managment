<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page</title>
    <style>
.heading{
    margin:40px;
    font-size:38px;
    font-weight:bold;
}
.event-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
    gap:30px;
    padding:40px;
}

.event-card{
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 20px rgba(0,0,0,.12);
    display:flex;
    flex-direction:column;
    height:620px;
    transition:.3s;
}

.event-card:hover{
    transform:translateY(-6px);
}

.event-card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-body{
    display:flex;
    flex-direction:column;
    flex:1;
    padding:18px;
}

.card-body h3{
    font-size:30px;
    margin-bottom:12px;
}

.card-body p{
    margin:6px 0;
    color:#555;
    line-height:1.5;
}

.price{
    font-size:30px;
    color:#0d6efd;
    font-weight:bold;
    margin-top:10px;
}

.buttons{
    margin-top:auto;
    display:flex;
    gap:12px;
}

.buttons button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
    color:#fff;
    font-size:17px;
    cursor:pointer;
}

.buttons button:first-child{
    background:#198754;
}

.buttons button:last-child{
    background:#dc3545;
}
</style>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">
</head>

<body>

            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#adminNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="adminNavbar">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="admin.html">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="./add.html">
                        Add Event
                    </a>
                </li>

                <!-- <li class="nav-item">
                    <a class="nav-link" href="#manageEvents">

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#bookings">
                        Bookings
                    </a>
                </li> -->

            </ul>

            <span class="text-white me-3 fw-semibold">
                👋 Admin
            </span>

            <button class="btn btn-danger" onclick="logoutAdmin()">
                Logout
            </button>

        </div>
        
    </div>
</nav>
